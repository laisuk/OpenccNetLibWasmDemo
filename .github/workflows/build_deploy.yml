name: Build and deploy Blazor WASM AOT

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  PUBLISH_DIR: bin/Release/net10.0/publish/wwwroot
  PAGES_BASE_PATH: /OpenccNetLibWasmDemo/

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish Blazor WASM AOT
        run: dotnet publish -c Release -p:RunAOTCompilation=true

      - name: Prepare GitHub Pages output
        shell: bash
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"${PAGES_BASE_PATH}\" />|" "${PUBLISH_DIR}/index.html"
          grep -F "<base href=\"${PAGES_BASE_PATH}\" />" "${PUBLISH_DIR}/index.html"
          touch "${PUBLISH_DIR}/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
